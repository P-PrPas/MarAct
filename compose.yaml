services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: maract
      POSTGRES_PASSWORD: maract
      POSTGRES_DB: maract
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U maract -d maract"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
